name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install QA dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Verify structure core and independent oracle
        run: python -m unittest discover -s tests -v
      - name: Verify JSON schemas and result scenarios
        run: python tests/check_schemas.py
      - name: Verify Python syntax and repository links
        run: python tests/check_repository.py
      - name: Verify change whitespace
        run: git diff --check HEAD^ HEAD
