name: Static demo

on:
  push:
    branches: [main]
    paths: ['demo/**', 'scripts/build_demo.py', 'scripts/demo_e2e.py', '.github/workflows/demo.yml', 'mazeproof/core.py', 'mazeproof/samples.py']
  pull_request:
    paths: ['demo/**', 'scripts/build_demo.py', 'scripts/demo_e2e.py', '.github/workflows/demo.yml', 'mazeproof/core.py', 'mazeproof/samples.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install . -r requirements-dev.txt
      - run: python scripts/build_demo.py
      - run: node --check _site/app.js && node --check _site/samples.js
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/demo_e2e.py
      - name: Keep visual verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: demo-preview
          path: .evidence/demo
          retention-days: 14
      - name: Upload only the synthetic static demo
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify-public:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Test the actual public URL
        env:
          DEMO_URL: ${{ needs.deploy.outputs.page_url }}
        run: python scripts/demo_e2e.py --url "$DEMO_URL" --output .evidence/demo-public
      - name: Keep public verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: demo-public
          path: .evidence/demo-public
          retention-days: 14
